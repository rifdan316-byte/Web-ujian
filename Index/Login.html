<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Asesmen Nasional SMP - Kemendikbud v2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/Style.css">
</head>
<body>

<div class="login-container" id="layer-login">
    <div class="login-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Logo_of_Ministry_of_Education_and_Culture_of_Republic_of_Indonesia.svg" alt="Logo">
        <h2>ASESMEN NASIONAL</h2>
        <p>Simulasi Ujian TKA SMP Berbasis Komputer</p>
        
        <div class="input-group">
            <label>NOMOR PESERTA / ID</label>
            <input type="text" id="login-id" placeholder="Contoh: 2026-001" autocomplete="off">
        </div>
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="login-pass" placeholder="••••••••" autocomplete="off">
        </div>
        <button class="btn btn-primary" id="btn-login" onclick="prosesLogin()">Masuk Jendela Ujian</button>
    </div>
</div>


<script>
</script>
</body>
</html>
